<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agents">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Sai Agents</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Sign in -->
<section id="auth" class="auth" hidden>
  <div class="authInner">
    <img class="authLogo" src="icon-192.png" alt="">
    <h1>Sai Agents</h1>
    <p class="authLead">Your Mac's AI apps, in your pocket.</p>

    <form id="setupForm" hidden>
      <div class="fieldGroup">
        <input id="cfgUrl" placeholder="https://project.supabase.co" autocapitalize="off" autocorrect="off">
        <input id="cfgKey" placeholder="Anon key" autocapitalize="off" autocorrect="off">
      </div>
      <button class="btn tinted" type="submit">Connect</button>
      <p class="fine">Project Settings → API. Never paste the service_role key here.</p>
    </form>

    <form id="signInForm">
      <div class="fieldGroup">
        <input id="email" type="email" placeholder="Email" autocomplete="username" autocapitalize="off">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      </div>
      <button class="btn tinted" type="submit">Sign In</button>
      <button type="button" class="textBtn" id="magicLink">Email me a sign-in link</button>
      <p id="authMsg" class="fine" role="status"></p>
    </form>
  </div>
</section>

<!-- App shell -->
<div id="app" class="app" hidden>
  <header class="nav" id="nav">
    <div class="navBar">
      <span class="navSide"></span>
      <span class="navTitle" id="navTitle">Runs</span>
      <span class="navSide right">
        <button id="compose" class="navIcon" aria-label="New task">
          <svg viewBox="0 0 24 24"><path d="M12 20h8"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
      </span>
    </div>
  </header>

  <div id="ptr" class="ptr" aria-hidden="true"><span class="spinner"></span></div>

  <div class="largeTitle">
    <h1 id="pageTitle">Runs</h1>
    <button id="macLine" class="macLine" data-state="unknown"><i></i><span>Checking your Mac…</span></button>
  </div>

  <nav id="filters" class="chips" aria-label="Filter by app"></nav>

  <main id="views">
    <section id="view-runs" class="view" aria-label="Runs"></section>
    <section id="view-sessions" class="view" aria-label="Sessions" hidden></section>
    <section id="view-apps" class="view" aria-label="Limits" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <button class="tab" data-tab="runs" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>Runs</span>
    </button>
    <button class="tab" data-tab="sessions" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5 4v-4.3A2.5 2.5 0 0 1 4 13.5z"/></svg><span>Sessions</span>
    </button>
    <button class="tab" data-tab="apps" aria-selected="false">
      <svg viewBox="0 0 24 24"><rect x="4" y="12" width="4" height="8" rx="1.2"/><rect x="10" y="7" width="4" height="13" rx="1.2"/><rect x="16" y="3" width="4" height="17" rx="1.2"/></svg><span>Limits</span>
    </button>
  </nav>
</div>

<!-- Pushed screen: a run thread or a session -->
<section id="detail" class="detail" hidden>
  <header class="nav detailNav">
    <div class="navBar">
      <span class="navSide">
        <button id="back" class="backBtn" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg><span id="backLabel">Runs</span>
        </button>
      </span>
      <span class="navTitle detailHead">
        <span id="detailTitle" class="detailTitle"></span>
        <span id="detailSub" class="detailSub"></span>
      </span>
      <span class="navSide right">
        <button id="more" class="navIcon" aria-label="Actions">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="12" r=".6" class="f"/><circle cx="12" cy="12" r=".6" class="f"/><circle cx="16" cy="12" r=".6" class="f"/></svg>
        </button>
      </span>
    </div>
  </header>
  <div id="thread" class="thread"></div>
  <form id="reply" class="composer" autocomplete="off">
    <div class="composerField">
      <textarea id="replyText" rows="1" enterkeyhint="send"></textarea>
      <button id="replySend" class="sendBtn" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </div>
  </form>
</section>

<!-- New task sheet -->
<div id="sheetBackdrop" class="backdrop" hidden></div>
<form id="sheet" class="sheet" autocomplete="off" hidden>
  <div class="sheetDrag" id="sheetDrag">
    <div class="grab"></div>
    <div class="sheetBar">
      <button type="button" class="textBtn" id="sheetClose">Cancel</button>
      <span class="sheetTitle">New Task</span>
      <button type="submit" class="textBtn strong" id="sheetSend">Send</button>
    </div>
  </div>
  <div id="appPicker" class="appPicker" role="radiogroup" aria-label="App"></div>
  <p id="pickerNote" class="pickerNote"></p>
  <textarea id="prompt" rows="6" placeholder="What should it do?"></textarea>
</form>

<!-- Action sheet -->
<div id="menuBackdrop" class="backdrop" hidden></div>
<div id="menu" class="actionSheet" role="menu" hidden></div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="hosted.js"></script>
</body>
</html>
