<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agents">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Sai Agents</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Sign in -->
<section id="auth" class="auth" hidden>
  <div class="authInner">
    <img class="authLogo" src="icon-192.png" alt="">
    <h1>Sai Agents</h1>
    <p class="muted">Run Claude, ChatGPT, Antigravity and DeepSeek on your Mac from anywhere.</p>

    <form id="setupForm" hidden>
      <input id="cfgUrl" placeholder="https://project.supabase.co" autocapitalize="off" autocorrect="off">
      <input id="cfgKey" placeholder="Anon key" autocapitalize="off" autocorrect="off">
      <button class="btn primary" type="submit">Connect</button>
      <p class="fine">Project Settings → API. Never paste the service_role key here.</p>
    </form>

    <form id="signInForm">
      <input id="email" type="email" placeholder="Email" autocomplete="username" autocapitalize="off">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn primary" type="submit">Sign in</button>
      <div class="authAlt">
        <button type="button" class="link" id="magicLink">Email me a link</button>
        <span class="sep"></span>
        <button type="button" class="link" id="signUp">Create account</button>
      </div>
      <p id="authMsg" class="fine" role="status"></p>
    </form>
  </div>
</section>

<!-- App -->
<div id="app" class="app" hidden>
  <header class="top">
    <h1 id="pageTitle">Runs</h1>
    <button id="macPill" class="macPill" data-state="unknown" aria-label="Mac status">
      <i></i><span>Mac</span>
    </button>
  </header>

  <nav id="filters" class="filters" aria-label="Filter by app"></nav>

  <main id="views">
    <section id="view-runs" class="view" aria-label="Runs"></section>
    <section id="view-sessions" class="view" aria-label="Sessions" hidden></section>
    <section id="view-apps" class="view" aria-label="Limits" hidden></section>
  </main>

  <button id="fab" class="fab" aria-label="New task">
    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
  </button>

  <nav class="tabbar" aria-label="Sections">
    <button class="tab" data-tab="runs" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" /></svg><span>Runs</span>
    </button>
    <button class="tab" data-tab="sessions" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4z" /></svg><span>Sessions</span>
    </button>
    <button class="tab" data-tab="apps" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M4 12h16M4 17h6"/></svg><span>Limits</span>
    </button>
  </nav>
</div>

<!-- Detail (run thread or session) -->
<section id="detail" class="detail" hidden>
  <header class="detailTop">
    <button id="back" class="iconBtn" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="detailHead">
      <span id="detailTitle" class="detailTitle"></span>
      <span id="detailSub" class="detailSub"></span>
    </div>
    <button id="more" class="iconBtn" aria-label="More">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
    </button>
  </header>
  <div id="thread" class="thread"></div>
  <form id="reply" class="reply" autocomplete="off">
    <textarea id="replyText" rows="1" enterkeyhint="send"></textarea>
    <button id="replySend" class="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    </button>
  </form>
</section>

<!-- New task sheet -->
<div id="sheetBackdrop" class="backdrop" hidden></div>
<form id="sheet" class="sheet" autocomplete="off" hidden>
  <div class="grab"></div>
  <div class="sheetHead">
    <h2>New task</h2>
    <button type="button" class="link" id="sheetClose">Cancel</button>
  </div>
  <div id="appPicker" class="appPicker" role="radiogroup" aria-label="App"></div>
  <p id="pickerNote" class="fine"></p>
  <textarea id="prompt" rows="4" placeholder="What should it do?"></textarea>
  <button class="btn primary" id="sheetSend" type="submit">Send to Mac</button>
</form>

<!-- Action menu -->
<div id="menu" class="menu" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="hosted.js"></script>
</body>
</html>
