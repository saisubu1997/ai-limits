<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08080c">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Queue</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo"></span>
    <div>
      <h1>Queue</h1>
      <p id="sub">connecting…</p>
    </div>
  </div>
  <button id="gear" class="ghost" aria-label="Settings">⚙</button>
</header>

<main id="list" class="list"></main>

<form id="composer" class="composer" autocomplete="off">
  <div class="chips" id="chips"></div>
  <div class="inputRow">
    <textarea id="prompt" rows="1" placeholder="Describe the task…" enterkeyhint="send"></textarea>
    <button id="send" type="submit" aria-label="Queue task">↑</button>
  </div>
</form>

<div id="sheet" class="sheet" hidden>
  <div class="sheetCard">
    <div class="sheetHead"><h2>Settings</h2><button id="closeSheet" class="ghost">✕</button></div>
    <label>Working directory
      <input id="workdir" placeholder="/Users/you/project">
    </label>
    <label>Supabase URL
      <input id="sbUrl" placeholder="https://xxxx.supabase.co">
    </label>
    <label>Supabase anon key
      <input id="sbKey" placeholder="eyJhbGciOi…" type="password">
    </label>
    <p class="hint">Create a <code>tasks</code> table with the SQL in <code>supabase.sql</code>. Leave blank to stay local-only.</p>
    <button id="saveSettings" class="primary">Save</button>
    <p id="saveState" class="hint"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
