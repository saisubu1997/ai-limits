<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0b0f">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Sai Agents</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <span class="logo"></span>
      <div>
        <h1>Sai Agents</h1>
        <p id="sub">connecting…</p>
      </div>
    </div>
    <button id="gear" class="iconBtn" aria-label="Settings">⚙</button>
  </header>

  <nav class="apps" id="apps"></nav>

  <div class="viewRow">
    <div class="views" role="tablist">
      <button class="view" data-tab="dashboard" aria-selected="true">Dashboard</button>
      <button class="view" data-tab="tasks" aria-selected="false">Tasks</button>
      <button class="view" data-tab="sessions" aria-selected="false">Chats</button>
    </div>
    <span class="viewCount" id="viewCount"></span>
  </div>

  <main id="dashboard" class="list"></main>
  <main id="list" class="list" hidden></main>
  <main id="sessions" class="list" hidden></main>
</div>

<form id="composer" class="composer" autocomplete="off">
  <div class="composerInner">
    <div id="target" class="target" hidden>
      <span id="targetLabel"></span>
      <button type="button" id="clearTarget" aria-label="Cancel">✕</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="inputRow">
      <textarea id="prompt" rows="1" placeholder="Describe a task…" enterkeyhint="send"></textarea>
      <button id="send" type="submit" aria-label="Queue task">↑</button>
    </div>
  </div>
</form>

<div id="sheet" class="sheet" hidden>
  <div class="sheetCard">
    <div class="sheetHead"><h2>Settings</h2><button id="closeSheet" class="iconBtn">✕</button></div>
    <label>Working directory
      <input id="workdir" placeholder="/Users/you/project">
    </label>
    <label>Queue threshold (% min remaining credits to run)
      <input id="queueThreshold" type="number" min="0" max="90" placeholder="10">
    </label>
    <label>Supabase URL
      <input id="sbUrl" placeholder="https://xxxx.supabase.co">
    </label>
    <label>Supabase anon key
      <input id="sbKey" placeholder="eyJhbGciOi…" type="password">
    </label>
    <p class="hint">Tasks will queue and wait until credits are available above the threshold. Create a <code>tasks</code> table with the SQL in <code>supabase.sql</code>.</p>
    <button id="saveSettings" class="primary">Save</button>
    <p id="saveState" class="hint"></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
